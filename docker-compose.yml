services:
  mysql:
    image: mysql:8.0
    container_name: mfd-mysql
    restart: unless-stopped
    # Host 3306/3307 are already taken on this machine. Container still speaks MySQL on 3306.
    ports:
      - "3308:3306"
    environment:
      MYSQL_DATABASE: mfd
      MYSQL_USER: mfd
      MYSQL_PASSWORD: mfd
      MYSQL_ROOT_PASSWORD: mfdroot
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-umfd", "-pmfd"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 12s
    volumes:
      - mfd_mysql:/var/lib/mysql

volumes:
  mfd_mysql:
